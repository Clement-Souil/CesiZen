name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # ── .NET API ──────────────────────────────────────────────────────────────
  api:
    name: API — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore CESIZenAPI/CESIZenAPI/CESIZenAPI.csproj

      - name: Build
        run: dotnet build CESIZenAPI/CESIZenAPI/CESIZenAPI.csproj --no-restore --configuration Release

      - name: Restore test dependencies
        run: dotnet restore CESIZenAPI/CESIZenAPI.Tests/CESIZenAPI.Tests.csproj

      - name: Run unit tests
        run: dotnet test CESIZenAPI/CESIZenAPI.Tests/CESIZenAPI.Tests.csproj --no-restore --configuration Release --verbosity normal

  # ── React Web ─────────────────────────────────────────────────────────────
  web:
    name: Web — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: cesizen-web/package-lock.json

      - name: Install dependencies
        working-directory: cesizen-web
        run: npm ci

      - name: Lint
        working-directory: cesizen-web
        run: npm run lint

      - name: Build
        working-directory: cesizen-web
        run: npm run build
