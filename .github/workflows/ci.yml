name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # ── .NET API — Build & Test ───────────────────────────────────────────────
  api:
    name: API — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore CESIZenAPI/CESIZenAPI/CESIZenAPI.csproj

      - name: Build
        run: dotnet build CESIZenAPI/CESIZenAPI/CESIZenAPI.csproj --no-restore --configuration Release

      - name: Restore test dependencies
        run: dotnet restore CESIZenAPI/CESIZenAPI.Tests/CESIZenAPI.Tests.csproj

      - name: Run unit tests
        run: dotnet test CESIZenAPI/CESIZenAPI.Tests/CESIZenAPI.Tests.csproj --no-restore --configuration Release --verbosity normal
        env:
          Jwt__Key: ${{ secrets.JWT_KEY }}

  # ── React Web — Lint & Build ──────────────────────────────────────────────
  web:
    name: Web — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: cesizen-web/package-lock.json

      - name: Install dependencies
        working-directory: cesizen-web
        run: npm ci

      - name: Lint
        working-directory: cesizen-web
        run: npm run lint

      - name: Build
        working-directory: cesizen-web
        run: npm run build

  # ── Trivy — Security Scan ────────────────────────────────────────────────
  security:
    name: Security — Trivy Scan
    runs-on: ubuntu-latest
    needs: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'CESIZenAPI/CESIZenAPI'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ── SonarCloud — Code Quality ─────────────────────────────────────────────
  sonar:
    name: Quality — SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Clement-Souil_CesiZen" \
            /o:"clement-souil86" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io"
          dotnet build CESIZenAPI/CESIZenAPI/CESIZenAPI.csproj --configuration Release
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
